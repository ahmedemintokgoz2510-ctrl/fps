name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check project
        shell: bash
        run: |
          set -e

          test -f package.json || {
            echo "ERROR: package.json is missing."
            exit 1
          }

          node -e "
            const p = require('./package.json');
            console.log('Project:', p.name || 'unnamed');
            console.log('Scripts:', JSON.stringify(p.scripts || {}, null, 2));
            if (!p.scripts || !p.scripts['prepare-www']) {
              console.error('ERROR: prepare-www script is missing.');
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor
        run: npx cap --version

      - name: Prepare game files
        run: npm run prepare-www

      - name: Create Android project if missing
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.mjs ]; then
            echo "ERROR: Capacitor configuration is missing."
            exit 1
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          test -f android/gradlew || {
            echo "ERROR: android/gradlew is missing."
            exit 1
          }

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fps-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
