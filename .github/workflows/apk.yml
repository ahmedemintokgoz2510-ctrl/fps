name: APK derle
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Bağımlılıkları kur ve three.js'i kopyala
        run: |
          npm install
          node scripts/prepare-www.js

      - name: Android projesini oluştur
        run: |
          npx cap add android
          # yatay mod + tam ekran
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' $STYLES
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Yayınla (telefondan indirilebilir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Arkadaş FPS APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
